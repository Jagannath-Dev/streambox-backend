# Hostinger Docker Manager — pull-only (no local Dockerfile build).
#
# 1) On your laptop (or CI), build & push:
#      docker build -t YOUR_DOCKERHUB_USER/streambox-backend:latest .
#      docker push YOUR_DOCKERHUB_USER/streambox-backend:latest
#
# 2) In Hostinger / .env set:
#      DOCKER_IMAGE=YOUR_DOCKERHUB_USER/streambox-backend:latest
#
# 3) Deploy this file (not docker-compose.yml):
#      docker compose -f docker-compose.hostinger.yml up -d

services:
  redis:
    image: redis:7-alpine
    container_name: streambox-redis
    ports:
      - "6379:6379"
    volumes:
      - streambox-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE e.g. youruser/streambox-backend:latest}
    container_name: streambox-api
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SEEDR_BASE_URL: ${SEEDR_BASE_URL:-https://www.seedr.cc}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      MOVIES_RULSZ: ${MOVIES_RULSZ:-https://www.5movierulz.vote/}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  streambox-redis-data:
