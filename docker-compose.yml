# Hostinger Docker Manager = PULL ONLY.
# Set DOCKER_IMAGE + all app secrets in Hostinger env (or provide .env next to compose).
#
# Important: do NOT re-list SUPABASE_*/TMDB_* under `environment:` with ${VAR}
# unless Hostinger also injects them — empty ${VAR} overrides env_file and crashes the app.

services:
  redis:
    image: redis:7-alpine
    container_name: streambox-redis
    ports:
      - "6379:6379"
    volumes:
      - streambox-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ${DOCKER_IMAGE:?Set DOCKER_IMAGE e.g. youruser/streambox-backend:latest}
    pull_policy: always
    container_name: streambox-api
    ports:
      - "${PORT:-3000}:3000"
    # Primary source of secrets (upload .env with the project, or paste vars in Hostinger UI)
    env_file:
      - .env
    environment:
      # Container networking only — secrets come from env_file / Hostinger env UI
      HOST: 0.0.0.0
      PORT: 3000
      # Use compose redis if REDIS_URL not set; otherwise keep your .env value
      # (e.g. redis://:pass@redis.stbox.online:6379)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  streambox-redis-data:
